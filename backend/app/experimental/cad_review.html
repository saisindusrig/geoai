<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GeoAI CAD geometry proof</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111820;color:#e6edf3;font:14px system-ui}header{padding:20px 24px;border-bottom:1px solid #35414c}h1{font-size:22px;margin:0 0 7px}p{margin:0;color:#adb8c2}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;height:calc(100vh - 93px)}#viewport{position:relative;min-height:450px}aside{border-left:1px solid #35414c;padding:22px;overflow:auto}label{display:block;margin-bottom:8px;color:#adb8c2}select,button{width:100%;padding:10px;background:#202d39;color:inherit;border:1px solid #46535e;border-radius:4px;margin-bottom:18px}h2{font-size:16px;margin:8px 0 12px}pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#c6d3dd}.hint{position:absolute;bottom:20px;left:24px;font-size:12px;color:#adb8c2;pointer-events:none}#status{margin-top:16px;font-size:12px;line-height:1.6}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}#viewport{height:55vh}aside{border-left:0}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><h1>GeoAI · CAD geometry proof</h1><p>Exact OCCT solids, derived render meshes · local metres · engineering unverified</p></header>
<main><section id="viewport"><div class="hint">Drag to orbit · scroll to zoom · click a component to inspect</div></section><aside>
<label for="mode">Review candidate</label><select id="mode"><option value="before">SUPPORT_FRAME · 5 m beams</option><option value="after">SUPPORT_FRAME · 6 m beams</option><option value="solids">Six isolated solid proofs</option></select>
<label for="component">Inspect component</label><select id="component"></select><button id="fit">Fit view</button><h2 id="name">Component</h2><pre id="details"></pre><p id="status">Loading local proof artifacts…</p></aside></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';
const results=await fetch('./results.json').then(r=>{if(!r.ok)throw Error('Proof results unavailable');return r.json()});
const viewport=document.getElementById('viewport'), scene=new THREE.Scene();scene.background=new THREE.Color('#111820');
const camera=new THREE.PerspectiveCamera(42,1,.01,1000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));viewport.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x34495d,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(7,10,8);scene.add(light);
const group=new THREE.Group();group.rotation.x=-Math.PI/2;scene.add(group);const grid=new THREE.GridHelper(16,16,0x53616d,0x27333f);scene.add(grid);
let outputs={}, selected=null;
const picker=document.getElementById('component'),mode=document.getElementById('mode'), ray=new THREE.Raycaster();
function inspect(id){selected=id;picker.value=id;for(const mesh of group.children)mesh.material.emissive.set(mesh.name===id?0x173c55:0);const o=outputs[id];document.getElementById('name').textContent=id;document.getElementById('details').textContent=JSON.stringify({semanticId:id,assetId:o.assetId,assemblyId:o.assemblyId,materialId:o.materialId,dimensionsM:o.metrics.boundsM.slice(3).map((v,i)=>+(v-o.metrics.boundsM[i]).toFixed(6)),cadVolumeM3:+o.metrics.volumeM3.toFixed(9),validSolid:o.metrics.valid,triangles:o.mesh.triangles.length,dependencyIds:o.dependencyIds,provenance:o.provenance,definitionHash:o.definitionHash,engineeringStatus:'UNVERIFIED'},null,2)}
function fit(){const bounds=new THREE.Box3().setFromObject(group),size=bounds.getSize(new THREE.Vector3()).length(),center=bounds.getCenter(new THREE.Vector3());controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1,.75,1).multiplyScalar(size*.95));camera.near=Math.max(.001,size/1000);camera.far=Math.max(100,size*100);camera.updateProjectionMatrix();controls.update()}
function load(){while(group.children.length){const mesh=group.children[0];group.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}const key=mode.value;outputs=key==='solids'?results.solids:results[key].outputs;picker.replaceChildren();let index=0;for(const [id,o] of Object.entries(outputs)){const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(o.mesh.positions.flat(),3));geometry.setIndex(o.mesh.triangles.flat());geometry.computeVertexNormals();const material=new THREE.MeshStandardMaterial({color:o.materialId==='concrete'?0xa6adb2:0x779cb9,metalness:.15,roughness:.65});const mesh=new THREE.Mesh(geometry,material);mesh.name=id;mesh.userData={semanticId:id};if(key==='solids')mesh.position.set((index%3)*3,Math.floor(index/3)*4,0);group.add(mesh);const option=document.createElement('option');option.value=id;option.textContent=id;picker.append(option);index++}inspect(Object.hasOwn(outputs,selected)?selected:Object.keys(outputs)[0]);fit();document.getElementById('status').textContent=key==='after'?'Two linked beams regenerated. Supports remain at 5 m. This overhang is geometrically valid and structurally unverified.':'Mesh is a derived display cache. The BIM definition and bounded CAD recipe remain authoritative.';document.body.dataset.ready='true'}
mode.addEventListener('change',load);picker.addEventListener('change',()=>inspect(picker.value));document.getElementById('fit').onclick=fit;
let down;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>4)return;const r=renderer.domElement.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);const hit=ray.intersectObjects(group.children)[0];if(hit)inspect(hit.object.name)});
new ResizeObserver(()=>{const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe(viewport);
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});load();
</script></body></html>
